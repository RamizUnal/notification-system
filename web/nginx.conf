# Serves the console and proxies everything else on the same origin, so the
# browser needs no CORS and the WebSocket shares the page's host.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve upstreams per request through Docker's DNS, so nginx starts even
  # when a backend is still booting (or the simulator is not running).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;
  set $mock http://mockprovider:8090;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # REST API and the /api/v1/events WebSocket stream.
  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Interactive API documentation.
  location ~ ^/(docs|openapi\.yaml)$ {
    proxy_pass $api;
  }

  # The provider simulator's admin API, used by the console's chaos controls.
  location /mock/ {
    rewrite ^/mock/(.*)$ /$1 break;
    proxy_pass $mock;
  }

  # Fingerprinted build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes all serve the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
