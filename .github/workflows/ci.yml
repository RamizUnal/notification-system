name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test Go (unit, integration, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -count=1 ./...
      # Integration tests start PostgreSQL and Redis with testcontainers,
      # using the Docker engine that GitHub's runners provide.
      - name: Integration and end-to-end tests with coverage
        run: go test -tags integration -race -count=1 -p 1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo "### Go coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  console:
    name: Console (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI spec
        run: npm run generate:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: One-command setup smoke test
    needs: [test, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: docker compose up --build --detach --wait
      - name: Deliver a notification end to end
        run: ./scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
