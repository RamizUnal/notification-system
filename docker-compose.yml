# One-command setup: docker compose up --build
#
#   Console          http://localhost:8070
#   API + Swagger    http://localhost:8080/docs
#   Traces (Jaeger)  http://localhost:16686
#   Mock provider    http://localhost:8090/admin/stats
name: notification-system

x-app: &app
  image: notification-system:local
  build:
    context: .
    target: runtime
  restart: unless-stopped
  init: true

x-env: &env
  DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the versioned schema migrations, then exits.
  migrate:
    <<: *app
    command: ["migrate", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Several workers share the queue (SKIP LOCKED) and the per-channel rate
  # limit (Redis). Scale with WORKER_REPLICAS or `docker compose up --scale worker=N`.
  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *env
      HTTP_ADDR: ":9090"
      PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:8090/send}
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mockprovider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local stand-in for webhook.site with latency and failure injection.
  mockprovider:
    <<: *app
    command: ["mockprovider"]
    environment:
      HTTP_ADDR: ":8090"
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.03}
      MOCK_MIN_LATENCY_MS: ${MOCK_MIN_LATENCY_MS:-30}
      MOCK_MAX_LATENCY_MS: ${MOCK_MAX_LATENCY_MS:-150}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Operator console: built React app behind nginx, which also proxies the
  # API, the WebSocket stream and the mock provider's admin API.
  web:
    image: notification-console:local
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-8070}:80"
    depends_on:
      api:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports:
      - "16686:16686"

  # Runs the whole test suite (unit + integration) inside Docker against the
  # services above: docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgres://notifications:notifications@postgres:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
